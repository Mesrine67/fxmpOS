name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'Mesrine67' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, fxmpos-ci]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native Dock sources
        run: pnpm build:windows-native

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

  rust:
    name: rust (windows-latest)
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'Mesrine67' && github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
    runs-on: [self-hosted, Windows, X64, fxmpos-ci]
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build native Dock resource
        run: node scripts/build-dock.mjs

      - name: Prefer Git Bash over Windows WSL bash shim
        shell: pwsh
        run: |
          $gitBash = 'C:\Program Files\Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBash 'bash.exe'))) {
            throw 'Git for Windows Bash was not found.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBash -Encoding utf8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  rust-msrv:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'Mesrine67' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, fxmpos-ci]
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build native Dock resource
        run: node scripts/build-dock.mjs

      - name: Prefer Git Bash over Windows WSL bash shim
        shell: pwsh
        run: |
          $gitBash = 'C:\Program Files\Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBash 'bash.exe'))) {
            throw 'Git for Windows Bash was not found.'
          }
          Add-Content -Path $env:GITHUB_PATH -Value $gitBash -Encoding utf8

      - name: Install minimum supported Rust version
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.95.0

      - name: Check minimum supported Rust version
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
