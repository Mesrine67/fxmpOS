name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  validate-release-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.validate.outputs.prerelease }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release ref and application version
        id: validate
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="$(node scripts/validate-release-source.mjs)"
          semver_without_build="${version%%+*}"
          if [[ "$semver_without_build" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Validated release source for FXMP OS $version ($GITHUB_REF)."

  publish-tauri:
    needs: validate-release-source
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Each platform updates the same latest.json asset on the draft release.
      max-parallel: 1
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: --bundles nsis,msi
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            standaloneUpload: true
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rustTargets: aarch64-apple-darwin
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            standaloneUpload: false
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rustTargets: x86_64-apple-darwin
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            standaloneUpload: false
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            rustTargets: ""
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            standaloneUpload: false
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Configure Windows Authenticode signing
        id: windows-signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            Write-Host "WINDOWS_CERTIFICATE is not configured; Windows installers will not have Authenticode signatures."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "fxmp-code-signing.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', ''))
            [IO.File]::WriteAllBytes($pfxPath, $certificateBytes)
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password |
              Where-Object HasPrivateKey |
              Select-Object -First 1

            if (-not $certificate) {
              throw "The Windows signing certificate could not be imported."
            }

            $tauriConfig = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = "sha256"
                  timestampUrl = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Compress -Depth 5

            Add-Content -Path $env:GITHUB_ENV -Value "TAURI_CONFIG=$tauriConfig" -Encoding utf8
            Add-Content -Path $env:GITHUB_OUTPUT -Value "thumbprint=$($certificate.Thumbprint)" -Encoding utf8
            Write-Host "Windows Authenticode signing is configured for this runner."
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build and publish signed update artifacts
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && (secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_SIGNING_IDENTITY || '-') || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_TEAM_ID || '' }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            See the assets below to download this version.
            The experimental Windows standalone executable is not an officially supported portable build and requires the Microsoft Edge WebView2 Runtime.
          releaseDraft: true
          prerelease: ${{ needs.validate-release-source.outputs.prerelease }}
          generateReleaseNotes: true
          retryAttempts: 2
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.assetPattern }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: Report operating-system signing status
        shell: pwsh
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          APPLE_NOTARIZATION_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if ($env:BUILD_PLATFORM -eq "windows-latest") {
            if ($env:WINDOWS_SIGNING_CONFIGURED -ne "true") {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Windows Authenticode: not configured; installers may show SmartScreen warnings."
            } else {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Windows Authenticode: certificate imported for this build."
            }
          } elseif ($env:BUILD_PLATFORM.StartsWith("macos-")) {
            $hasDeveloperId = $env:APPLE_SIGNING_CONFIGURED -eq "true"
            $hasNotarizationCredentials = $env:APPLE_NOTARIZATION_CONFIGURED -eq "true"

            if ($hasNotarizationCredentials) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- macOS: Developer ID signing and notarization credentials are configured."
            } elseif ($hasDeveloperId) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- macOS: Developer ID signing is configured; notarization credentials are incomplete."
            } else {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- macOS: Developer ID signing is not configured; builds are ad hoc and not notarized."
            }
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Linux: no operating-system package signature is configured; updater Minisign signatures are verified separately."
          }

      - name: Upload experimental Windows standalone executable
        if: matrix.standaloneUpload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $metadata = cargo metadata --manifest-path "src-tauri/Cargo.toml" --no-deps --format-version 1 | ConvertFrom-Json
          $binaryTarget = $metadata.packages[0].targets |
            Where-Object { $_.kind -contains "bin" } |
            Select-Object -First 1

          if (-not $binaryTarget) {
            throw "Could not determine the Windows binary target from Cargo metadata."
          }

          $binaryPath = Join-Path "src-tauri/target/release" "$($binaryTarget.name).exe"
          if (-not (Test-Path -LiteralPath $binaryPath)) {
              throw "The standalone executable was not found at $binaryPath."
          }

          $safeProductName = ($config.productName -replace '[^A-Za-z0-9._-]+', '-').Trim('-')
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $assetName = "$safeProductName-$version-windows-x64-standalone-experimental.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          Copy-Item -LiteralPath $binaryPath -Destination $assetPath
          gh release upload "v$version" $assetPath --clobber

      - name: Remove Windows signing certificate from runner
        if: always() && matrix.platform == 'windows-latest' && steps.windows-signing.outputs.thumbprint != ''
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.windows-signing.outputs.thumbprint }}
        run: |
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:CERTIFICATE_THUMBPRINT" -Force -ErrorAction SilentlyContinue

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: ${{ matrix.name }}"
            echo "- Version: ${{ steps.tauri.outputs.appVersion }}"
            echo "- Draft release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
            echo "- Artifacts: ${{ steps.tauri.outputs.artifactPaths }}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-updater-release:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Download draft updater manifest
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync("src-tauri/tauri.conf.json", "utf8")).version)')"
          tag="v${version}"
          mkdir -p release-assets
          gh release download "$tag" \
            --pattern latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify updater manifest and signed bundles
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.assets.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-updater-release.mjs "$RELEASE_VERSION"

      - name: Upload release checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.assets.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" "release-assets/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
