[package]
name = "fxmp-os"
version = "0.0.48"
description = "A FXMP Tauri App OS for monitoring and controlling your PC"
authors = ["FXMP"]
license = "LGPL-3.0-only"
edition = "2024"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_fxmp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sysinfo = "0.39.6"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"
wmi = "0.18.4"
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["ApplicationModel", "ApplicationModel_Core", "Foundation", "Management_Deployment", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.22"
png = "0.18"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
